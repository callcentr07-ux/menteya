<!doctype html>
<html lang="ru" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ментея — вариант А «Два снимка»</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ebe5e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Вариант А: снимки как отпечатки на стене галереи. Один шрифт, розово-серая стена, снимки без цвета,
   зелёный — только у кнопки записи */
:root{
  --bg:#ebe5e3; --surface:#e1dad7; --ink:#2b2622; --muted:#6a615d; --accent:#0f7d45; --accent-ink:#fff;
  --font-display:"EB Garamond", Georgia, serif; --font-text:"EB Garamond", Georgia, serif;
  --step-small:clamp(0.9375rem, 0.91rem + 0.1vw, 1rem);
  --step-body:clamp(1.125rem, 1.05rem + 0.3vw, 1.3125rem);
  --step-title:clamp(1.75rem, 2.5vw, 2.5rem);
  --m:30px; --g:20px;
}
html{ -webkit-tap-highlight-color:transparent; }
a{ text-decoration:none; }

/* Навигация: слова слева, запись справа */
.a-nav{ position:absolute; z-index:3; inset:var(--m) var(--m) auto; display:flex; justify-content:space-between; align-items:center; gap:24px; font-size:var(--step-small); }
.a-nav-l, .a-nav-r{ display:flex; align-items:center; gap:28px; }
.a-word{ font-size:1.5rem; font-weight:500; letter-spacing:-0.01em; line-height:1; }
.a-links{ display:flex; gap:24px; }
.a-links a, .a-phone, .a-menu{ text-decoration:underline; text-decoration-color:transparent; text-underline-offset:.22em; text-decoration-thickness:.06em; transition:text-decoration-color var(--t-hover) ease; }
.a-phone{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.a-btn{ display:inline-flex; align-items:center; min-height:44px; padding:0 20px; background:var(--accent); color:var(--accent-ink); font-weight:500; white-space:nowrap; touch-action:manipulation; -webkit-user-select:none; user-select:none; transition:transform var(--t-press) var(--ease-out), background-color var(--t-hover) ease; }
.a-btn:active{ transform:scale(.97); }
.a-menu{ display:none; }
@media (hover:hover) and (pointer:fine){
  .a-links a:hover, .a-phone:hover, .a-menu:hover{ text-decoration-color:currentColor; }
  .a-btn:hover{ background:#0c6a3a; }
}

/* Первый экран: два отпечатка, заголовок в левом нижнем углу, фраза справа */
.a-hero{ position:relative; height:100svh; min-height:640px; overflow:hidden; container-type:inline-size; }
.a-hero > *{ --col:calc((100cqw - 2 * var(--m) - 11 * var(--g)) / 12); }
.a-print{ position:absolute; margin:0; }
.a-print img{ width:100%; object-fit:cover; filter:grayscale(1); background:var(--surface); }
.a-print figcaption{ margin-top:12px; font-size:var(--step-small); line-height:1.35; color:var(--muted); }
.a-print-lg{ left:calc(var(--m) + 4 * (var(--col) + var(--g))); top:11%; width:min(calc(5 * var(--col) + 4 * var(--g)), 64svh); }
.a-print-lg img{ aspect-ratio:4 / 5; object-position:50% 25%; }
.a-print-sm{ left:calc(var(--m) + var(--col) + var(--g)); top:50%; width:12cqw; }
.a-print-sm img{ aspect-ratio:1; object-position:28% 60%; filter:grayscale(1) brightness(.88); }
.a-title{ position:absolute; left:var(--m); bottom:var(--m); max-width:calc(4 * var(--col) + 3 * var(--g)); font-size:var(--step-title); font-style:italic; font-weight:400; line-height:1.1; letter-spacing:-0.01em; }
.a-lead{ position:absolute; left:calc(var(--m) + 9 * (var(--col) + var(--g))); bottom:calc(var(--m) + 2px); width:calc(3 * var(--col) + 2 * var(--g)); max-width:24ch; font-size:1rem; line-height:1.5; }

/* Телефон и узкие экраны: снимки сверху, текст прижат к низу */
@media (max-width:899px){
  :root{ --m:20px; }
  .a-nav{ inset:16px var(--m) auto; }
  .a-links, .a-phone{ display:none; }
  .a-menu{ display:inline-flex; align-items:center; min-height:44px; }
  .a-nav-r{ gap:18px; }
  .a-btn{ min-height:40px; padding:0 16px; }
  .a-hero{ height:auto; min-height:100svh; display:flex; flex-direction:column; padding:max(76px, 12svh) var(--m) 28px; }
  .a-prints{ position:relative; margin-bottom:56px; }
  .a-print{ position:relative; inset:auto; }
  .a-print-lg{ width:min(78%, 46svh); margin-left:auto; }
  .a-print-sm{ position:absolute; left:0; top:calc(min(78cqw, 46svh) * 1.25 - 24px); width:30%; }
  .a-print figcaption{ display:none; }
  .a-title{ position:static; margin-top:auto; max-width:none; font-size:max(1.5rem, 6.4vw); }
  .a-lead{ position:static; width:auto; max-width:34ch; margin-top:14px; }
}

/* Движение: отпечатки проявляются, главный снимок медленно приближается к зрителю */
@media (prefers-reduced-motion:no-preference){
  .js .a-print-lg img{ animation:a-drift 14s var(--ease-out) both; }
  .js .a-print .shutter-in{ clip-path:inset(0 0 100% 0); animation:a-shutter 1.1s var(--ease-in-out) forwards; animation-delay:calc(var(--i, 0) * 90ms + 200ms); }
}
@keyframes a-drift{ from{ transform:scale(1.07); } }
@keyframes a-shutter{ to{ clip-path:inset(0); } }
.shutter-in{ display:block; overflow:hidden; }
</style>
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<header class="a-nav">
  <div class="a-nav-l">
    <a class="a-word" href="#" data-rise style="--i:0">Ментея</a>
    <nav class="a-links" aria-label="Разделы сайта" data-rise style="--i:1">
      <a href="#uslugi">Услуги</a>
      <a href="#vrachi">Врачи</a>
      <a href="#ceny">Цены</a>
    </nav>
  </div>
  <div class="a-nav-r">
    <a class="a-phone" href="tel:+74950000000" data-rise style="--i:2">+7 495 000-00-00</a>
    <a class="a-menu" href="#menu" data-rise style="--i:2">Меню</a>
    <a class="a-btn" href="#booking" data-rise style="--i:3">Записаться</a>
  </div>
</header>

<main>
  <section class="a-hero" aria-labelledby="a-title">
    <div class="a-prints">
      <figure class="a-print a-print-lg">
        <span class="shutter-in" style="--i:1"><img src="../assets/img/intro-main.jpg" width="700" height="700" alt="Анна Викторовна Соколова, врач-психиатр клиники «Ментея»" fetchpriority="high"></span>
        <figcaption data-rise style="--i:6">Анна Соколова, врач-психиатр</figcaption>
      </figure>
      <figure class="a-print a-print-sm">
        <span class="shutter-in" style="--i:3"><img src="../assets/img/about-3.jpg" width="900" height="506" alt="Кабинет для первой консультации: два кресла у окна"></span>
        <figcaption data-rise style="--i:7">Кабинет первой консультации</figcaption>
      </figure>
    </div>
    <h1 class="a-title" id="a-title" data-rise style="--i:4">Психиатрическая клиника<br> в&nbsp;Москве</h1>
    <p class="a-lead" data-rise style="--i:5">Анонимно, без постановки на&nbsp;учёт. Взрослым, подросткам, детям и&nbsp;пожилым, в&nbsp;клинике и&nbsp;на&nbsp;дому.</p>
  </section>
</main>
</body>
</html>
