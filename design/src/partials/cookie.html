<!-- ============ СОГЛАСИЕ НА COOKIE ============ -->
<!-- 152-ФЗ: счётчики (Яндекс Метрика) подключаются только после «Принять». Выбор хранится в браузере;
     изменить его можно ссылкой «Настройки cookie» в подвале. Без скриптов плашка не показывается — и счётчиков нет. -->
<section class="cookie" id="cookieBanner" aria-label="Согласие на использование cookie" hidden>
  <div class="cookie-head">
    <span class="cookie-ic" aria-hidden="true"><svg class="i"><use href="#i-cookie"/></svg></span>
    <b>Мы используем cookie</b>
  </div>
  <p>Они нужны, чтобы сайт работал, а с вашего согласия — для статистики посещений (Яндекс Метрика). Подробнее — в <a href="#">политике обработки cookie</a>.</p>
  <div class="cookie-actions">
    <button class="btn btn-primary btn-sm" type="button" data-cookie="accept">Принять</button>
    <button class="btn btn-outline btn-sm" type="button" data-cookie="decline">Отклонить</button>
  </div>
</section>
