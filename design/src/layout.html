<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12409e">
<script>document.documentElement.classList.add('js')</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<!-- Превью ссылки в Telegram, ВК и поисковиках. В WordPress эти теги выводит SEO-плагин; домен — заглушка -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Клиника «Ментея»">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="https://menteya.ru/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<!-- Шрифт — с сайта; кириллицу грузим заранее, чтобы текст сразу был в фирменном шрифте -->
<link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- Все стили одним сжатым файлом; собирает build.py из assets/css/base.css и assets/css/blocks/*.css -->
<link rel="stylesheet" href="assets/css/menteya.min.css">
</head>
<body>

<!-- @include sprite.html -->

<!-- @include header.html -->

<main id="main">

{{content}}

</main>

<!-- @include footer.html -->

<!-- @include bottombar.html -->

<script src="assets/js/menteya.js" defer></script>

</body>
</html>
