<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f262c">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<!-- js — включены скрипты; no-motion — посетитель выключил анимацию кнопкой в подвале; has-motion — полное движение (motion.js).
     Ставим до первой отрисовки. is-loading держит прокрутку на время заставки; страховка через 3,2 с показывает страницу, даже если скрипт не загрузился -->
<script>(function(c){c.add('js');try{if(localStorage.getItem('menteya-motion')==='off')c.add('no-motion');else if(!matchMedia('(prefers-reduced-motion: reduce)').matches){c.add('has-motion','is-loading');setTimeout(function(){if(!c.contains('is-ready')){c.add('is-ready');c.remove('is-loading');var l=document.getElementById('loader');if(l)l.hidden=true}},3200)}}catch(e){}})(document.documentElement.classList)</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<!-- Превью ссылки в Telegram, ВК и поисковиках. В WordPress эти теги выводит SEO-плагин; домен — заглушка -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Клиника «Ментея»">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary_large_image">
<!-- Шрифты пока с Google Fonts; перед запуском — файлами на сайте (без запросов к чужим серверам) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<!-- Все стили одним сжатым файлом; собирает build.py из assets/css/core.css и assets/css/blocks/*.css -->
<link rel="stylesheet" href="assets/css/menteya.min.css">
</head>
<body>

<!-- @include sprite.html -->

<!-- Заставка и занавес между страницами (motion.css / motion.js): видны только при html.has-motion -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-in">
    <svg class="loader-mark" viewBox="0 0 64 64" focusable="false">
      <circle class="loader-ring" cx="32" cy="32" r="28" pathLength="1"/>
      <circle class="loader-ring loader-ring-2" cx="32" cy="32" r="24.2" pathLength="1"/>
      <text class="loader-m" x="32" y="43.2" text-anchor="middle">М</text>
    </svg>
    <p class="loader-word"><span>М</span><span>Е</span><span>Н</span><span>Т</span><span>Е</span><span>Я</span></p>
    <p class="loader-sub">психиатрическая клиника</p>
  </div>
</div>
<!-- Линия прогресса чтения и медленное сияние фона за прозрачными разделами — только при html.has-motion -->
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>

<!-- @include header.html -->

<main id="main">

{{content}}

</main>

<!-- @include footer.html -->

<!-- @include bottombar.html -->

<!-- @include booking-modal.html -->

<!-- @include cookie.html -->

<script src="assets/js/menteya.js" defer></script>
<!-- Движение: заставка, плавная прокрутка, параллакс, появление по словам. Только при html.has-motion -->
<script src="assets/js/motion.js" defer></script>

</body>
</html>
